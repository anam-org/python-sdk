[project]
name = "anam"
version = "0.9.0-alpha.4"
description = "Official Python SDK for Anam AI - Real-time AI avatar streaming"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anam AI", email = "support@anam.ai" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["anam", "ai", "avatar", "streaming", "webrtc", "real-time"]

dependencies = [
    "aiortc>=1.14.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.2.1",
    "av>=16.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# Optional display utilities for testing
display = [
    "opencv-python>=4.9.0",
    "sounddevice>=0.4.6",
]

[project.urls]
Homepage = "https://www.anam.ai"
Documentation = "https://docs.anam.ai"
Repository = "https://github.com/anam-org/python-sdk"
Issues = "https://github.com/anam-org/python-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anam"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_decorators = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/anam/_version.py:__version__"]
tag_format = "v{version}"
commit_parser = "conventional"
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"
allow_zero_version = true
major_on_zero = false
build_command = "uv build"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
